services:
  axnovus-care-agent:
    build:
      context: .
    container_name: axnovus-care-agent
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.2}
      OPENAI_ALLOWED_MODELS: ${OPENAI_ALLOWED_MODELS:-gpt-5.2,gpt-4.1,gpt-4.1-mini,gpt-4o-mini}
      PORT: 4173
    ports:
      - "${HOST_PORT:-4174}:4173"
    restart: unless-stopped
